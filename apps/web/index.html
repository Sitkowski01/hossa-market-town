<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#030712" />
    <meta name="description" content="Żywa makieta 3D miasteczka, w którym każda firma jest notowana na giełdzie — kursy powstają w arkuszu zleceń." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M1 13 6 7l3 3 6-7' fill='none' stroke='%2310b981' stroke-width='2'/%3E%3C/svg%3E" />
    <title>Hossa: miasteczko na giełdzie</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main>
      <h1 class="tylko-czytnik">Hossa: miasteczko na giełdzie</h1>
      <canvas id="scena" aria-label="Makieta miasteczka"></canvas>
      <div id="ladowanie">
        <div class="ladowanie-karta">
          <p class="ladowanie-znacznik"><span aria-hidden="true"></span>Gospodarka · giełda · 3D</p>
          <p class="ladowanie-nazwa">Hossa</p>
          <p class="ladowanie-opis">Miasteczko, w którym gospodarka porusza kursy giełdy</p>
          <div class="ladowanie-pasek" role="progressbar" aria-label="Wczytywanie makiety" aria-valuemin="0" aria-valuemax="100"><span></span></div>
          <p class="ladowanie-tekst" role="status">Wczytywanie makiety…</p>
        </div>
      </div>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
