name: CI

on:
  push:
    branches: [main]
  pull_request:

# Token CI tylko do odczytu repozytorium; akcje przypiete do commitu (tag mozna przesunac na inny kod).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build, typy, lint, reguly architektury, testy z pokryciem
        run: pnpm check

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mutation testing (Stryker, prog 90%)
        run: pnpm mutation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: stryker
          path: |
            packages/*/reports/mutation
            apps/web/reports/mutation

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Chromium dla Playwright
        run: pnpm --filter @hossa/web exec playwright install --with-deps chromium
      # Tryb polaczony: prawdziwy Parkiet z obrazu ghcr.io, swiezy (puste arkusze) tylko dla tego przebiegu
      - name: Parkiet (gielda w Javie) w dockerze
        run: |
          docker compose -f parkiet/compose.yaml up -d
          for i in $(seq 1 60); do curl -sf localhost:8088/api/instruments && exit 0; sleep 2; done
          docker compose -f parkiet/compose.yaml logs parkiet
          exit 1
      - name: Makieta w przegladarce (WebGL przez SwiftShader)
        run: pnpm --filter @hossa/web e2e
        env:
          PARKIET_E2E: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright
          path: apps/web/test-results
